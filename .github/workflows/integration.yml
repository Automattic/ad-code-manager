name: Run PHPUnit

on:
  # Run on all pushes and on all pull requests.
  # Prevent the "push" build from running when there are only irrelevant changes.
  push:
    paths-ignore:
      - "**.md"
  pull_request:

  # Allow manually triggering the workflow.
  workflow_dispatch:

# Disable all permissions by default. Enable specific permissions per job.
permissions: {}

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: WP ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    env:
      WP_VERSION: ${{ matrix.wordpress }}
      # Without this, the tests run on the PHP version in .wp-env.json,
      # whatever the matrix says.
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    strategy:
      matrix:
        include:
          # Check lowest supported WP version, with the lowest supported PHP.
          - wordpress: '6.4'
            php: '7.4'
          # Check the WP version in the readme's "Tested up to", with the latest PHP.
          - wordpress: '7.1'
            php: '8.5'
          # Check latest WP with the latest PHP.
          - wordpress: 'master'
            php: '8.6'
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${TOOL_CACHE}/php.json"
        env:
          TOOL_CACHE: ${{ runner.tool_cache }}

      - name: Setup Problem Matchers for PHPUnit
        run: echo "::add-matcher::${TOOL_CACHE}/phpunit.json"
        env:
          TOOL_CACHE: ${{ runner.tool_cache }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Setup wp-env
        run: npx --no wp-env start
        env:
          WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress }}

      # Fail if wp-env didn't install the WordPress version the job names.
      # Trunk reports a development version, such as 7.2-alpha-61234.
      - name: Check the WordPress version
        run: |
          actual="$(npx --no wp-env run cli wp core version 2>/dev/null | grep -Eo '^[0-9]+\.[0-9][^[:space:]]*')"
          echo "WordPress ${actual} (job: ${WP_VERSION})"
          if [ "${WP_VERSION}" = master ]; then
            [[ "${actual}" == *-* ]] || { echo "::error::Expected a trunk development version, got '${actual}'"; exit 1; }
          else
            [[ "${actual}" == "${WP_VERSION}" || "${actual}" == "${WP_VERSION}".* ]] || { echo "::error::Expected WordPress ${WP_VERSION}, got '${actual}'"; exit 1; }
          fi

      - name: Run integration tests (single site)
        run: composer test:integration --no-interaction

      - name: Run integration tests (multisite)
        run: composer test:integration-ms --no-interaction
