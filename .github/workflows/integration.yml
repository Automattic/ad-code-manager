name: Run PHPUnit

on:
  # Run on all pushes and on all pull requests.
  # Prevent the "push" build from running when there are only irrelevant changes.
  push:
    paths-ignore:
      - "**.md"
  pull_request:

  # Allow manually triggering the workflow.
  workflow_dispatch:

# Disable all permissions by default. Enable specific permissions per job.
permissions: {}

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: WP ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    env:
      WP_VERSION: ${{ matrix.wordpress }}

    strategy:
      matrix:
        php: [ '7.4', '8.3' ]
        wordpress: [ '6.4', '6.8' ]
        allowed_failure: [false]
        include:
          # Check upcoming WP.
          - php: '8.3'
            wordpress: 'master'
            allowed_failure: true
          # Check upcoming PHP.
          - php: '8.5'
            wordpress: '6.8'
            allowed_failure: true
      fail-fast: false
    continue-on-error: ${{ matrix.allowed_failure }}

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install wordpress environment
        run: npm install -g @wordpress/env

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${TOOL_CACHE}/php.json"
        env:
          TOOL_CACHE: ${{ runner.tool_cache }}

      - name: Setup Problem Matchers for PHPUnit
        run: echo "::add-matcher::${TOOL_CACHE}/phpunit.json"
        env:
          TOOL_CACHE: ${{ runner.tool_cache }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520 # 3.1.1

      - name: Setup wp-env
        run: wp-env start
        env:
          WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress }}

      - name: Run integration tests
        run: composer test:integration --no-interaction
